[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maf-hitl-learning"
version = "0.1.0"
description = "Beginner-friendly Microsoft Agent Framework human-in-the-loop learning lab"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "agent-framework-core==1.19.0",
  "jupyterlab>=4.4,<5",
]

[project.optional-dependencies]
openai = [
  "agent-framework-openai==1.19.0",
  "python-dotenv>=1.1,<2",
]

[tool.setuptools]
py-modules = []
