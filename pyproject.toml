[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maf-learning-lab"
version = "0.2.0"
description = "Beginner-friendly Microsoft Agent Framework course with agents, tools, sessions, workflows, orchestration, and HITL"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "agent-framework-core==1.19.0",
  "jupyterlab>=4.4,<5",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
foundry = [
  "agent-framework-foundry==1.19.0",
  "azure-identity>=1.25,<2",
]
openai = [
  "agent-framework-openai==1.19.0",
]
all-models = [
  "agent-framework-foundry==1.19.0",
  "agent-framework-openai==1.19.0",
  "azure-identity>=1.25,<2",
]

[tool.setuptools]
py-modules = []
